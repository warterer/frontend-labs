<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Реуцький, HTML5, таблиці, hover, лабораторна робота 2, КПІ, ІМ-41">
    <meta name="description" content="Лабораторна робота №2. Завдання 1.">
    <title>Реуцький А.О. ІМ-41</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
 
        table {
            width: 900px;
            border-collapse: collapse;
        }
 
        td {
            border: 2px solid #333333;
            height: 50px;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            font-size: 18px;
            font-weight: bold;
            color: #111111;
        }
 
        tbody.row-1 td {
            background-color: #028f8f;
        }
 
        tbody.row-2 td {
            background-color: #f5f502;
        }

        tbody.row-1:hover td {
            background-color: #f5f502;
        }
 
        tbody.row-2:hover td {
            background-color: #028f8f;
        }
    </style>
</head>
<body>
    <table>
        <tbody class="row-1">
            <tr>
                <td rowspan="3">Реуцький</td>
                <td>Артем</td>
                <td rowspan="3">Олександрович</td>
                <td>&nbsp;</td>
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
        </tbody>
        <tbody class="row-2">
            <tr>
                <td>ІМ-41</td>
                <td colspan="2">Лабораторна робота №2</td>
                <td>Варіант 2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
