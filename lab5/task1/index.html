<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Реуцький, HTML5, CSS3, JS, RegEx, лабораторна робота 5, ІМ-41"
    />
    <meta name="description" content="Лабораторна робота №5. Завдання 1." />
    <title>Реуцький А.О. ІМ-41</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="studentForm" novalidate>
      <h1>Форма студента</h1>

      <div class="row" id="row-pib">
        <label for="pib">ПІБ</label>
        <input type="text" id="pib" placeholder="Реуцький А.О." />
      </div>
      <div class="row" id="row-group">
        <label for="group">Група</label>
        <input type="text" id="group" placeholder="ІМ-41" />
      </div>
      <div class="row" id="row-phone">
        <label for="phone">Телефон</label>
        <input type="text" id="phone" placeholder="(097)-123-45-67" />
      </div>
      <div class="row" id="row-idcard">
        <label for="idcard">ID-card</label>
        <input type="text" id="idcard" placeholder="ЕН №123456" />
      </div>
      <div class="row" id="row-faculty">
        <label for="faculty">Факультет</label>
        <input type="text" id="faculty" placeholder="ФІОТ" />
      </div>

      <button type="submit">Надіслати</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
